name: Test
on: [push, pull_request]
jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
      - run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - run: nimble install -y
      - run: nimble test
